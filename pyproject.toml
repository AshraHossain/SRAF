[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sraf"
version = "0.1.0"
description = "Policy-gated reflective agents and offline evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ashra Hossain" }]
keywords = ["agents", "reflection", "llm", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AshraHossain/SRAF"
Repository = "https://github.com/AshraHossain/SRAF"
Issues = "https://github.com/AshraHossain/SRAF/issues"