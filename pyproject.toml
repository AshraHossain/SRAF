[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "sraf"
version = "0.1.0"
description = "Policy-gated reflective agents and offline evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []
[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
crewai = ["crewai>=0.100"]
autogen = ["autogen-agentchat>=0.4", "autogen-ext[openai]>=0.4"]
dev = ["pytest>=8", "ruff>=0.8"]
[project.scripts]
sraf = "sraf.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
